name: Build Eric Android Release APKs

# Phone and Wear OS share the production package and release certificate.
on:
  push:
    tags:
      - "v*-eric.*"
  workflow_dispatch:

jobs:
  build-release-apk:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_VARIANT: production
      NODE_ENV: production
      SPARKY_RELEASE_STORE_FILE: ${{ github.workspace }}/SparkyFitnessMobile/android/app/sparky-fitness-release-key.keystore
      SPARKY_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      SPARKY_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      SPARKY_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" -Dorg.gradle.caching=true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate production Android project
        working-directory: SparkyFitnessMobile
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: |
          pnpm exec expo prebuild --platform android --clean
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m/' android/gradle.properties
          printf '\norg.gradle.caching=true\n' >> android/gradle.properties
      - name: Configure shared release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$SPARKY_RELEASE_KEY_ALIAS"
          test -n "$SPARKY_RELEASE_STORE_PASSWORD"
          test -n "$SPARKY_RELEASE_KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SPARKY_RELEASE_STORE_FILE"
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Make gradlew executable
        run: chmod +x SparkyFitnessMobile/android/gradlew
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > SparkyFitnessMobile/android/local.properties
      - name: Verify production Android variant
        run: grep -n "applicationId 'com.SparkyApps.SparkyFitnessMobile'" SparkyFitnessMobile/android/app/build.gradle
      - name: Generate async-storage codegen
        working-directory: SparkyFitnessMobile/android
        run: ./gradlew :react-native-async-storage_async-storage:generateCodegenArtifactsFromSchema --no-daemon --max-workers=2
      - name: Test Wear OS app
        working-directory: SparkyFitnessMobile/android
        run: ./gradlew :wearos:testDebugUnitTest --no-daemon --max-workers=2 --stacktrace
      - name: Build phone release APK
        working-directory: SparkyFitnessMobile/android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2 --stacktrace
      - name: Build Wear OS release APK
        working-directory: SparkyFitnessMobile/android
        run: ./gradlew :wearos:assembleRelease --no-daemon --max-workers=2 --stacktrace
      - name: Prepare and verify APK artifacts
        id: apk
        run: |
          set -euo pipefail
          APK_PATH=$(find SparkyFitnessMobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          WEAR_PATH=SparkyFitnessMobile/android/wearos/build/outputs/apk/release/wearos-release.apk
          test -n "$APK_PATH"
          test -f "$WEAR_PATH"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          PHONE_CERT=$("$APKSIGNER" verify --print-certs "$APK_PATH" | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}')
          WEAR_CERT=$("$APKSIGNER" verify --print-certs "$WEAR_PATH" | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}')
          EXPECTED_CERT=$(keytool -exportcert -alias "$SPARKY_RELEASE_KEY_ALIAS" -keystore "$SPARKY_RELEASE_STORE_FILE" -storepass:env SPARKY_RELEASE_STORE_PASSWORD | sha256sum | awk '{print $1}')
          test -n "$PHONE_CERT"
          test "$PHONE_CERT" = "$EXPECTED_CERT"
          test "$PHONE_CERT" = "$WEAR_CERT"
          APK_NAME="SparkyFitness-${GITHUB_REF_NAME:-manual}-arm64-release.apk"
          WEAR_NAME="SparkyFitness-${GITHUB_REF_NAME:-manual}-wearos-release.apk"
          cp "$APK_PATH" "$APK_NAME"
          cp "$WEAR_PATH" "$WEAR_NAME"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "wear_name=$WEAR_NAME" >> "$GITHUB_OUTPUT"
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SparkyFitness-${{ github.ref_name }}-release-apks
          path: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.wear_name }}
          if-no-files-found: error
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.wear_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
