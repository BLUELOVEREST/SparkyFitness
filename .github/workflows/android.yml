name: Build Eric Android Release APK

on:
  push:
    tags:
      - "v*-eric.*"
  workflow_dispatch:

jobs:
  build-release-apk:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      APP_VARIANT: production
      NODE_ENV: production
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate production Android project
        working-directory: SparkyFitnessMobile
        run: pnpm exec expo prebuild --platform android --clean

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x SparkyFitnessMobile/android/gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > SparkyFitnessMobile/android/local.properties

      - name: Verify production Android variant
        run: grep -n "applicationId 'com.SparkyApps.SparkyFitnessMobile'" SparkyFitnessMobile/android/app/build.gradle

      - name: Build release APK
        working-directory: SparkyFitnessMobile/android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2 --stacktrace

      - name: Prepare APK artifact
        id: apk
        run: |
          APK_PATH=$(find SparkyFitnessMobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -n "$APK_PATH"
          APK_NAME="SparkyFitness-${GITHUB_REF_NAME:-manual}-arm64-release.apk"
          cp "$APK_PATH" "$APK_NAME"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
          draft: false
          prerelease: false
          generate_release_notes: true
